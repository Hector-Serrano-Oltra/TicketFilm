<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Iniciar Sesión</h2>

        <form>
            <label>Usuario:</label>
            <input type="text" required>

            <label>Contraseña:</label>
            <input type="password" required>

            <button type="submit">Login</button>
        </form>

        <br>

        <button class="secondary-btn" onclick="window.location.href='registro.html'">
            Registrar
        </button>
    </div>

</body>
</html>
